# =====================================================================
#  Ejercicio de integración: api-gateway → order-service ⇄ catalog-service
#
#  Puertos expuestos al host:
#    8080 api-gateway     (único punto de entrada para clientes)
#    8081 order-service   (directo, para depurar)
#    8082 catalog-service (directo, para depurar / inyectar fallas)
#    8474 toxiproxy API   (chaos)
#    15432/15433 Postgres (orders/catalog)   16379 Redis   9094 Kafka
#    8090 kafka-ui        9090 prometheus   3000 grafana   16686 jaeger
# =====================================================================

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    KAFKA_BOOTSTRAP: kafka:9092
  deploy:
    resources:
      limits:
        memory: 768m

services:
  # ------------------------------------------------------------------ datos
  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports: ["15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ mensajería
  # Kafka en modo KRaft (sin Zookeeper). Dos listeners:
  #   kafka:9092      para los contenedores
  #   localhost:9094  para clientes desde el host (IDE, tests manuales)
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------------ chaos
  # order-service NO habla directo con catalog-service: pasa por este proxy TCP,
  # que permite inyectar latencia, cortes y errores en caliente (ver scripts/chaos.sh).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports: ["8474:8474"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro

  # ------------------------------------------------------------------ servicios
  catalog-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: catalog-service
    image: integration/catalog-service:latest
    ports: ["8082:8082"]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://catalog-db:5432/catalog
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s

  order-service:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: order-service
    image: integration/order-service:latest
    ports: ["8081:8081"]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://orders-db:5432/orders
      CATALOG_BASE_URL: http://toxiproxy:8666
    depends_on:
      orders-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s

  api-gateway:
    <<: *java-service
    build:
      context: .
      args:
        SERVICE: api-gateway
    image: integration/api-gateway:latest
    ports: ["8080:8080"]
    environment:
      <<: *java-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORDER_SERVICE_URL: http://order-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 20s

  # ------------------------------------------------------------------ observabilidad
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/integration.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    ports: ["16686:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
